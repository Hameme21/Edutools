name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis & Tests
        run: |
          flutter analyze
          flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Edutools ${{ github.ref_name }}
          body: |
            ### Edutools Mobile App Release ${{ github.ref_name }} 🚀
            
            - **Renamed to Edutools**: Upgraded brand and app launcher identity.
            - **Official Insight UI App Logo**: High-definition launcher icon on mobile.
            - **Fall 2026 / Spring 2027 Academic Calendar**: Full trimester notices with holiday auto-conflict resolution.
            - **Accurate Category Placement**: Semester fees, holidays, administrative milestones, and events properly sorted.
            - **Strict .ICS Class Isolation**: Imported class schedules are only added to Classes, not duplicating into Events.
            - **4-Second Auto-Dismiss Update Popup**: Streamlined notifications and popup boxes.
            - **Responsive Dialog Boxes**: Fixed all layout and overflow issues on small mobile screens.
            
            Download `app-release.apk` below and install directly on your Android phone!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
