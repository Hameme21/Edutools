name: educal
description: "Edutools - Smart Academic Calendar and Reminder App with Holiday Conflict Resolution"
publish_to: 'none'
version: 1.1.4+16

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  file_picker: ^13.2.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  shared_preferences: 2.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  shared_preferences_foundation: 2.3.5
  shared_preferences_android: 2.2.3

flutter:
  uses-material-design: true
  assets:
    - sample_data/
